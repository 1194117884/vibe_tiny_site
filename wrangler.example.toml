name = "tinysite"
main = "src/worker.js"
compatibility_date = "2025-06-01"

# Copy this file to wrangler.toml, then replace every placeholder before deploying.
workers_dev = false
routes = [
  { pattern = "console.example.com", custom_domain = true },
  { pattern = "admin-console.example.com", custom_domain = true },
  # This must match SAAS_CNAME_TARGET so custom-hostname traffic reaches the Worker.
  { pattern = "customers.example.com/*", zone_name = "example.com" },
  { pattern = "*-site.example.com/*", zone_name = "example.com" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "tinysite_db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "tinysite-sites"

[vars]
SITE_BASE_DOMAIN = "example.com"
SITE_HOST_SUFFIX = "-site"
# Google Identity Services (One Tap) Web Client ID. Leave empty to hide Google login.
GOOGLE_CLIENT_ID = ""
# Cloudflare for SaaS provider zone and configured fallback CNAME target.
CLOUDFLARE_SAAS_ZONE_ID = "REPLACE_WITH_CLOUDFLARE_SAAS_ZONE_ID"
SAAS_CNAME_TARGET = "customers.example.com"
CUSTOM_DOMAINS_ENABLED = "false"
# Stripe recurring subscription price IDs. Keep disabled until all prices,
# secrets and the webhook endpoint are configured.
STRIPE_ENABLED = "false"
STRIPE_PRICE_PRO = "price_..."
STRIPE_PRICE_PLUS = "price_..."
STRIPE_PRICE_ULTRA = "price_..."

# Store the narrowly scoped API token as a Worker secret, never in this file:
#   npx wrangler secret put CLOUDFLARE_API_TOKEN
#   npx wrangler secret put STRIPE_SECRET_KEY
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET

[triggers]
# Reconcile pending hostname ownership and TLS state.
crons = ["*/10 * * * *"]
