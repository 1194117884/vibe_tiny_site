name = "tinysite"
main = "src/worker.js"
compatibility_date = "2025-06-01"

# 自定义域名和项目泛域名路由。请先完成 Cloudflare DNS 配置，再执行 `npm run deploy`。
workers_dev = false
routes = [
  { pattern = "ts.yongkl.cc", custom_domain = true },
  { pattern = "admin-ts.yongkl.cc", custom_domain = true },
  { pattern = "*-ts.yongkl.cc/*", zone_name = "yongkl.cc" },
]

# 管理后台静态资源（public/ 目录），未命中的请求交给 Worker 处理
[assets]
directory = "./public"
binding = "ASSETS"
# 项目站点与管理后台共用同一 Worker。必须先运行 Worker，避免根路径 /index.html
# 被管理后台静态资源直接命中，导致 {slug}-ts 域名无法进入项目站点路由。
run_worker_first = true

# D1 数据库：部署前执行 `npm run db:create`，把返回的 database_id 填到下面
[[d1_databases]]
binding = "DB"
database_name = "tinysite_db"
database_id = "f56b564b-3b14-4fef-85f8-8d2fa96ca16f"

# R2 存储桶：部署前执行 `npm run r2:create`
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "tinysite-sites"

# 生产域名：管理后台为 ts.yongkl.cc；项目用 {slug}-ts.yongkl.cc，避免与既有三级域名冲突。
[vars]
SITE_BASE_DOMAIN = "yongkl.cc"
SITE_HOST_SUFFIX = "-ts"
